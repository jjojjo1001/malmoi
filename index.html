/* Player location is readable above nearby scenery and friends. */
.player-locator { position:absolute; transform:translateX(-50%); z-index:10001; display:flex; align-items:center; flex-direction:column; pointer-events:none; }

.player-arrow { color:#175dd0; font-size:27px; line-height:27px; -webkit-text-stroke:1px white; filter:drop-shadow(0 2px 1px #18374c77); }
.player-ring { position:absolute; width:72px; height:25px; bottom:-4px; left:-1px; border:3px solid #175dd0; border-radius:50%; background:#d4e9ff66; box-shadow:0 0 0 2px #fff; z-index:-1; }
.object.sign-interaction { background:transparent; border:0; padding:0; transform:translate(-50%,-100%); box-shadow:none; border-radius:6px; }

.object.sign-interaction.near { outline:3px solid #f7c943; outline-offset:2px; }
.object.sign-interaction:focus-visible { outline:3px solid #175dd0; }
.flyer-object { width:125px; }
.loose-flyer { filter:drop-shadow(2px 3px 1px #314b3650); }

/* Map scenery keeps a transparent background on hover and focus. */

#world .object:focus-visible { outline:3px solid #175dd0; outline-offset:3px; }
#world .object.contest-object { width:392px;height:524px; }

/* Place the activity guide below the progress card instead of overlapping it. */
.entry-guide { top:170px; }

.object.sign-interaction { background:transparent; border:0; padding:0; transform:translate(-50%,-100%); box-shadow:none; border-radius:6px; }

.flyer-object { width:125px; }

    <script>
class LocalStorageProvider extends StorageProvider {
  constructor() {
    super();
    this.prefix = "malmoi:v1:";
    this.memory = {};
    this.failedKeys = new Set();
    this.warning = "";
  }
  read(k, f) {
    if (this.failedKeys.has(k)) return this.memory[k] ?? f;
    try {
      const raw = localStorage.getItem(this.prefix + k);
      return raw ? JSON.parse(raw) : f;
    } catch (e) {
      this.warning =
        "저장 데이터를 읽을 수 없습니다. JSON 백업을 확인해 주세요.";
      return this.memory[k] ?? f;
    }
  }
  write(k, v) {
    this.memory[k] = v;
    try {
      localStorage.setItem(this.prefix + k, JSON.stringify(v));
      this.failedKeys.delete(k);
    } catch (e) {
      this.failedKeys.add(k);
      this.warning =
        "이 브라우저에서 영구 저장이 불가능합니다. 닫기 전에 JSON으로 저장해 주세요.";
      window.dispatchEvent(new Event("storage-warning"));
    }
  }
  listProfiles() {
    const a = this.read("profiles", []);
    return Array.isArray(a)
      ? a
          .filter(
            (x) =>
              x && typeof x.id === "string" && typeof x.nickname === "string",
          )
          .map((x) => ({
            ...x,
            avatarId: ["avatar_0", "avatar_1", "avatar_2", "avatar_3"].includes(
              x.avatarId,
            )
              ? x.avatarId
              : "avatar_0",
          }))
      : [];
  }
  createProfile(p) {
    this.write("profiles", [...this.listProfiles(), p]);
    return p;
  }
  getProfile(id) {
    return this.listProfiles().find((x) => x.id === id);
  }
  setActiveUser(id) {
    this.write("activeUserId", id);
  }
  getActiveUser() {
    return this.getProfile(this.read("activeUserId", null));
  }
  getProgress(id) {
    const p = this.read("user:" + id + ":progress", {});
    return p && typeof p === "object" && !Array.isArray(p) ? p : {};
  }
  saveProgress(id, p) {
    this.write("user:" + id + ":progress", p);
  }
  listDictionaryEntries(id) {
    const a = this.read("user:" + id + ":dictionary", []);
    return Array.isArray(a)
      ? a.filter(
          (e) => e && typeof e.id === "string" && typeof e.word === "string",
        )
      : [];
  }
  saveDictionaryEntry(id, e) {
    const a = this.listDictionaryEntries(id),
      i = a.findIndex((x) => x.id === e.id);
    if (i < 0) a.push(e);
    else a[i] = e;
    this.write("user:" + id + ":dictionary", a);
  }
  deleteDictionaryEntry(id, eid) {
    this.write(
      "user:" + id + ":dictionary",
      this.listDictionaryEntries(id).filter((e) => e.id !== eid),
    );
  }
  listOtherLocalUsers(id) {
    return this.listProfiles().filter((p) => p.id !== id);
  }
  exportUserData(id) {
    return {
      schemaVersion: 1,
      app: "malmoi-village",
      profile: this.getProfile(id),
      dictionary: this.listDictionaryEntries(id),
      progress: this.getProgress(id),
    };
  }
  importUserData(payload) {
    const p = {
      ...payload.profile,
      id: uid(),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    p.nickname += " (불러옴)";
    p.avatarId = ["avatar_0", "avatar_1", "avatar_2", "avatar_3"].includes(
      p.avatarId,
    )
      ? p.avatarId
      : "avatar_0";
    this.createProfile(p);
    const idMap = new Map();
    payload.dictionary.forEach((e) => {
      const id = uid();
      idMap.set(e.id, id);
      this.saveDictionaryEntry(p.id, { ...e, id, ownerId: p.id });
    });
    const pr = JSON.parse(JSON.stringify(payload.progress));
    if (pr.exhibition) {
      pr.exhibition.entryIds = pr.exhibition.entryIds.map((id) =>
        idMap.get(id),
      );
      pr.exhibition.explanations = Object.fromEntries(
        Object.entries(pr.exhibition.explanations)
          .filter(([id]) => idMap.has(id))
          .map(([id, v]) => [idMap.get(id), v]),
      );
    }
    if (pr.zones?.wordContest?.createdEntryIds)
      pr.zones.wordContest.createdEntryIds =
        pr.zones.wordContest.createdEntryIds
          .map((id) => idMap.get(id))
          .filter(Boolean);
    this.saveProgress(p.id, pr);
    return p;
  }
}
window.LocalStorageProvider = LocalStorageProvider;

</script>

class DictionaryService {
  constructor(provider) {
    this.provider = provider;
  }
  save(user, entry) {
    const old = this.provider
      .listDictionaryEntries(user.id)
      .find(
        (e) =>
          e.sourceInteractionId === entry.sourceInteractionId &&
          e.word === entry.word,
      );
    const e = {
      id: old?.id || uid(),
      ownerId: user.id,
      originalWord: "",
      meaning: "",
      sentence: "",
      reason: "",
      favorite: false,
      creatorUserId: user.id,
      creatorNickname: user.nickname,
      copiedFromEntryId: null,
      copiedFromNickname: null,
      createdAt: old?.createdAt || new Date().toISOString(),
      ...old,
      ...entry,
      updatedAt: new Date().toISOString(),
    };
    this.provider.saveDictionaryEntry(user.id, e);
    return e;
  }
}

    <script>
class ProgressService {
  constructor(provider) {
    this.provider = provider;
  }
  get(id) {
    const raw = this.provider.getProgress(id),
      p = {
        introCompleted: false,
        zones: {},
        completed: [],
        visitedWords: [],
        selectedWords: [],
        ...raw,
      };
    for (const k of ["completed", "visitedWords", "selectedWords"])
      if (!Array.isArray(p[k])) p[k] = [];
    if (!p.zones || typeof p.zones !== "object" || Array.isArray(p.zones))
      p.zones = {};
    return p;
  }
  mark(id, key) {
    const p = this.get(id);
    p.completed = [...new Set([...p.completed, key])];
    const zone = key.startsWith("slang_")
      ? "friendsPlaza"
      : key.startsWith("flyer_") || key.startsWith("sign_")
        ? "flyerStreet"
        : null;
    if (zone)
      p.zones[zone] = {
        completedInteractions: p.completed.filter((x) =>
          zone === "friendsPlaza"
            ? x.startsWith("slang_")
            : x.startsWith("flyer_") || x.startsWith("sign_"),
        ),
      };
    this.provider.saveProgress(id, p);
    return p;
  }
  save(id, p) {
    this.provider.saveProgress(id, p);
  }
  unlocked(id) {
    const p = this.get(id),
      c = p.completed;
    return (
      p.introCompleted &&
      friendActivities.filter((a) => !a.optional && c.includes(a.id)).length >= 5 &&
      c.filter((x) => x.startsWith("flyer_")).length >= 3 &&
      c.filter((x) => x.startsWith("sign_")).length >= 3 &&
      p.selectedWords.length >= 1 &&
      this.provider
        .listDictionaryEntries(id)
        .some((e) => e.category === "myNewWord")
    );
  }
}

    <script>
const Collision = {
  withinPolygon(x,y,points) {
    let inside=false;
    for(let i=0,j=points.length-1;i<points.length;j=i++) {
      const [xi,yi]=points[i], [xj,yj]=points[j];
      if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
    }
    return inside;
  },
  blocked(x,y,rects) {
    return x<30 || y<30 || x>1970 || y>2270 ||
      (mapData.walkable && !mapData.walkable.some(p=>this.withinPolygon(x,y,p))) ||
      rects.some(r=>x>r.x-18 && x<r.x+r.w+18 && y>r.y-12 && y<r.y+r.h+18);
  },
};

    root.innerHTML = `<div class="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button id="close-modal" aria-label="닫기">✕</button></header><div id="modal-content">${content}</div></section></div>`;
    root.querySelector("#close-modal").onclick = () => this.close();
    root.querySelector("#close-modal").focus();
    return root.querySelector("#modal-content");
  },
  close() {
    document.querySelector("#modal-root").innerHTML = "";
    if (window.game) {
      game.paused = false;
      game.keys.clear();
    }
  },
};
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") Modal.close();
  if (e.key === "Tab" && document.querySelector(".modal")) {
    const a = [
      ...document
        .querySelector(".modal")
        .querySelectorAll("button,input,textarea,select,[tabindex]"),
    ].filter((x) => !x.disabled && !x.hidden && x.getClientRects().length);
    if (e.shiftKey && document.activeElement === a[0]) {
      e.preventDefault();
      a.at(-1).focus();
    } else if (!e.shiftKey && document.activeElement === a.at(-1)) {
      e.preventDefault();
      a[0].focus();
    }
  }
});

class ExportImportService {
  constructor(provider) {
    this.provider = provider;
  }
  validate(p) {
    const fail = (m) => {
      throw Error(m);
    };
    if (!p || p.app !== "malmoi-village" || p.schemaVersion !== 1)
      fail("말모이 마을 v1 JSON 파일인지 확인해 주세요.");
    if (
      !p.profile ||
      typeof p.profile.nickname !== "string" ||
      !p.profile.nickname.trim() ||
      p.profile.nickname.length > 40
    )
      fail("프로필 정보가 올바르지 않습니다.");
    if (!Array.isArray(p.dictionary) || p.dictionary.length > 5000)
      fail("사전 목록이 올바르지 않습니다.");
    if (new Set(p.dictionary.map((e) => e?.id)).size !== p.dictionary.length)
      fail("중복된 사전 카드 번호가 있습니다.");
    const cats = [
      "slangRewrite",
      "spellingFix",
      "spacingFix",
      "beautifulKorean",
      "myNewWord",
      "copiedFromFriend",
    ];
    for (const e of p.dictionary) {
      if (
        !e ||
        typeof e.id !== "string" ||
        typeof e.word !== "string" ||
        !e.word.trim() ||
        e.word.length > 500 ||
        !cats.includes(e.category)
      )
        fail("사전 카드의 필수 정보가 올바르지 않습니다.");
      for (const key of [
        "meaning",
        "reason",
        "sentence",
        "originalWord",
        "creatorNickname",
        "copiedFromNickname",
        "sourceZone",
        "sourceInteractionId",
      ])
        if (
          e[key] != null &&
          (typeof e[key] !== "string" || e[key].length > 5000)
        )
          fail("사전 카드의 문자열 정보가 올바르지 않습니다.");
    }
    if (
      !p.progress ||
      typeof p.progress !== "object" ||
      Array.isArray(p.progress)
    )
      fail("진행 정보가 올바르지 않습니다.");
    for (const key of ["completed", "visitedWords", "selectedWords"])
      if (
        p.progress[key] != null &&
        (!Array.isArray(p.progress[key]) ||
          p.progress[key].some((x) => typeof x !== "string"))
      )
        fail("진행 목록이 올바르지 않습니다.");
    if (p.progress.selectedWords?.length > koreanWords.length)
      fail("선택한 우리말 목록이 올바르지 않습니다.");
    if (
      p.progress.marketNotes != null &&
      (!p.progress.marketNotes ||
        typeof p.progress.marketNotes !== "object" ||
        Object.values(p.progress.marketNotes).some(
          (v) => typeof v !== "string",
        ))
    )
      fail("장터 메모가 올바르지 않습니다.");
    if (
      p.progress.zones?.wordContest?.createdEntryIds != null &&
      (!Array.isArray(p.progress.zones.wordContest.createdEntryIds) ||
        p.progress.zones.wordContest.createdEntryIds.some(
          (v) => typeof v !== "string",
        ))
    )
      fail("새말 목록이 올바르지 않습니다.");
    if (
      p.progress.zones != null &&
      (!p.progress.zones || typeof p.progress.zones !== "object" || Array.isArray(p.progress.zones))
    )
      fail("구역 정보가 올바르지 않습니다.");
    if (p.progress.worldPosition != null &&
        (!p.progress.worldPosition || !Number.isFinite(p.progress.worldPosition.x) ||
         !Number.isFinite(p.progress.worldPosition.y) ||
         p.progress.worldPosition.x < 30 || p.progress.worldPosition.x > 1970 ||
         p.progress.worldPosition.y < 30 || p.progress.worldPosition.y > 2270))
      fail("마을 위치 정보가 올바르지 않습니다.");
    if (p.progress.exhibition) {
      const x = p.progress.exhibition;
      if (
        !Array.isArray(x.entryIds) ||
        (x.completedAt ? x.entryIds.length !== 3 : x.entryIds.length > 3) ||
        new Set(x.entryIds).size !== x.entryIds.length ||
        x.entryIds.some((id) => !p.dictionary.some((e) => e.id === id)) ||
        typeof x.criteria !== "string" ||
        !x.explanations ||
        typeof x.explanations !== "object" ||
        Array.isArray(x.explanations) ||
        x.entryIds.some((id) => typeof x.explanations[id] !== "string" || !x.explanations[id].trim()) ||
        Object.values(x.explanations).some((v) => typeof v !== "string")
      )
        fail("전시 정보가 올바르지 않습니다.");
    }
    return p;
  }
  import(p) {
    return this.provider.importUserData(this.validate(p));
  }
}
function exportJSON() {
  const payload = storage.exportUserData(user.id),
    blob = new Blob([JSON.stringify(payload, null, 2)], {
      type: "application/json",
    }),
    url = URL.createObjectURL(blob),
    a = document.createElement("a");
  a.href = url;
  a.download =
    "malmoi-" + user.nickname.replace(/[^\p{L}\p{N}_-]/gu, "_") + ".json";
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("JSON 파일을 저장했어요. 다운로드 폴더를 확인하세요.");
}
function importJSON() {
  const c = Modal.open(
    "말모이 불러오기",
    `<p>기존 사전과 충돌하지 않도록 <b>새 프로필로 가져옵니다.</b> 원래 프로필은 그대로 유지됩니다.</p><label>말모이 JSON 파일 <input id="json-file" type="file" accept=".json,application/json"></label><div id="import-preview"></div><div id="import-error" class="error" role="status"></div>`,
  );
  c.querySelector("#json-file").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      if (file.size > 10 * 1024 * 1024)
        throw Error("10MB 이하의 JSON을 선택해 주세요.");
      const payload = new ExportImportService(storage).validate(
        JSON.parse(await file.text()),
      );
      c.querySelector("#import-preview").innerHTML =
        `<div class="card"><b>${esc(payload.profile.nickname)}</b> · ${payload.dictionary.length}개의 말</div><button class="primary" id="confirm-import">새 프로필로 불러오기</button>`;
      c.querySelector("#import-error").textContent = "";
      c.querySelector("#confirm-import").onclick = () => {
        const p = new ExportImportService(storage).import(payload);
        start(profiles.select(p.id));
        toast("새 프로필로 불러왔어요.");
      };
    } catch (err) {
      c.querySelector("#import-preview").innerHTML = "";
      c.querySelector("#import-error").textContent =
        "불러오기 실패: " + err.message;
    }
  };
}

 c.querySelector('#delete-cancel').onclick=()=>entryDetail(e,owner,false,filter);
 c.querySelector('#delete-confirm').onclick=()=>{
  if(!user||owner.id!==user.id||!storage.listDictionaryEntries(user.id).some(a=>a.id===e.id))return;
  storage.deleteDictionaryEntry(user.id,e.id);
  const p=progress.get(user.id),remaining=storage.listDictionaryEntries(user.id);
  if(e.category==='beautifulKorean'&&!remaining.some(a=>a.category==='beautifulKorean'&&a.sourceInteractionId===e.sourceInteractionId))p.selectedWords=p.selectedWords.filter(id=>id!==e.sourceInteractionId);
  if(p.zones?.wordContest?.createdEntryIds)p.zones.wordContest.createdEntryIds=p.zones.wordContest.createdEntryIds.filter(id=>id!==e.id);
  if(p.exhibition?.entryIds?.includes(e.id)){p.exhibition.entryIds=p.exhibition.entryIds.filter(id=>id!==e.id);delete p.exhibition.explanations[e.id];p.exhibition.completedAt=null;}

 };
}

 const blobCache=new Map();const compactImage=url=>{if(!url.startsWith('data:image/')||!url.includes(';base64,'))return url;if(blobCache.has(url))return blobCache.get(url);const [meta,b64]=url.split(','),raw=atob(b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const result=URL.createObjectURL(new Blob([bytes],{type:meta.slice(5).split(';')[0]}));blobCache.set(url,result);return result;};
